// Función central para obtener el número del último capítulo/episodio publicado.
// Intenta múltiples endpoints y nunca pide al usuario si puede evitarlo.

// ── Helper: fetch con timeout + retry automático en 429 (rate limit Jikan) ──
async function _jikanFetch(url, timeoutMs=8000, _retries=2){
  for(let attempt=0;attempt<=_retries;attempt++){
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),timeoutMs);
    try{
      const res=await fetch(url,{signal:ctrl.signal});
      clearTimeout(tid);
      if(res.status===429){
        // Rate limit: esperar con backoff exponencial (1s, 2s, 4s) antes de reintentar
        if(attempt<_retries){
          const wait=1000*Math.pow(2,attempt);
          await new Promise(r=>setTimeout(r,wait));
          continue;
        }
        return null;
      }
      if(!res.ok) return null;
      return await res.json();
    }catch(e){clearTimeout(tid);return null;}
  }
  return null;
}

// ── Fuente 1: Jikan endpoint individual ──────────────────────────────────────
async function _srcJikanIndividual(malId, type){
  try{
    const ep=type==="manga"?"manga":"anime";
    const d=await _jikanFetch(`https://api.jikan.moe/v4/${ep}/${malId}`);
    if(!d) return 0;
    const isAiring=type==="manga"?(d?.data?.publishing===true):(d?.data?.airing===true);
    const cnt=type==="manga"?(d?.data?.chapters||0):(d?.data?.episodes||0);
    // Para series en emisión, Jikan devuelve null en chapters/episodes.
    // Estrategia diferenciada por tipo:
    //   manga: delegar a _getMangaCount (Jikan /chapters → Jikan individual)
    //   anime: AniList nextAiringEpisode.episode-1 es la fuente más precisa
    if(!cnt && isAiring){
      if(type==="manga"){
        // Manga en emision: delegar a _getMangaCount (Jikan paged -> individual)
        return _getMangaCount(malId,null,0);
      }else{
        // Para anime en emision: AniList nextAiringEpisode es la fuente mas precisa
        const alCnt=await _srcAniList(malId,type);
        return alCnt||0;
      }
    }
    return cnt||0;
  }catch(e){return 0;}
}

// ── Fuente 2: Jikan /chapters o /episodes con paginación ─────────────────────
// Para manga en emisión: Jikan lista cada capítulo con campo "chapter" (string)
// Ejemplo: { "mal_id": 1, "chapter": "166", "title": "Chapter 166", ... }
async function _srcJikanPaged(malId, type){
  try{
    const ep=type==="manga"?"manga":"anime";
    const field=type==="manga"?"chapters":"episodes";
    const d=await _jikanFetch(`https://api.jikan.moe/v4/${ep}/${malId}/${field}?page=1`);
    if(!d||!Array.isArray(d.data)||!d.data.length) return 0;

    // Si la paginación conoce el total (manga finalizado): usarlo directamente
    const tot=d.pagination?.items?.total||0;
    if(tot>0) return tot;

    // Para manga en emisión: pagination.items.total es null → ir a última página
    const lp=d.pagination?.last_visible_page||1;

    // Helper robusto: extrae el número de capítulo/episodio de un entry de Jikan
    const extractNum=(entry)=>{
      if(!entry) return 0;
      // Para manga: campo "chapter" (string numérico como "166")
      // Para anime: campo "episode" (number o string)
      // NOTA: entry.mal_id es el ID del registro en la lista de caps de MAL, NO el número
      // de capítulo — no debe usarse como candidato (genera números incorrectos en emisión).
      const candidates=type==="manga"
        ?[entry.chapter, entry.chapters, entry.number, entry.no]
        :[entry.episode, entry.episodes, entry.number, entry.no];
      for(const v of candidates){
        if(v===null||v===undefined||v==="none"||v==="") continue;
        const n=parseFloat(String(v));
        if(Number.isFinite(n)&&n>0) return Math.floor(n);
      }
      // Fallback: extraer número del título (ej: "Chapter 166" → 166)
      const txt=String(entry.title||entry.name||"");
      const m=txt.match(/(?:chapter|cap(?:[ií]tulo)?|episode|ep)\.?\s*#?\s*(\d+(?:\.\d+)?)/i);
      if(m) return Math.floor(parseFloat(m[1]))||0;
      // Fallback numérico genérico (solo si no hay otra opción)
      const m2=txt.match(/\b(\d{1,4}(?:\.\d+)?)\b/);
      if(m2) return Math.floor(parseFloat(m2[1]))||0;
      return 0;
    };

    if(lp<=1){
      // Solo 1 página — para manga en emisión, d.data.length = número de caps publicados
      // El campo pagination.items.count también lo confirma.
      const itemsCount=d.pagination?.items?.count||d.data.length;
      const last=d.data[d.data.length-1];
      const lastNum=extractNum(last);
      // Si extractNum obtiene un número mayor que itemsCount, confiar en él (numeración real)
      // Si no, usar itemsCount como fallback (número de registros = número de caps)
      return lastNum>0?Math.max(lastNum,itemsCount):itemsCount;
    }

    // Múltiples páginas: ir a la última para obtener el capítulo más reciente
    const dL=await _jikanFetch(`https://api.jikan.moe/v4/${ep}/${malId}/${field}?page=${lp}`);
    if(dL?.data?.length){
      const totL=dL.pagination?.items?.total||0;
      if(totL>0) return totL;
      const last=dL.data[dL.data.length-1];
      const n=extractNum(last);
      if(n>0) return n;
      // Fallback aritmético: (páginas-1)*100 + items en última página
      return (lp-1)*100+dL.data.length;
    }
    return (lp-1)*100+d.data.length;
  }catch(e){return 0;}
}

// ── Kitsu API — chapterCount via mappings (MAL ID → Kitsu ID → chapterCount) ──
// Endpoint /mappings permite buscar por MAL ID exacto sin ambigüedad de título.
// filter[externalSite]=myanimelist/manga + filter[externalId]={malId} + include=item
// retorna el manga de Kitsu directamente con su chapterCount actualizado.
// chapterCount en Kitsu se mantiene al día para manga en emisión (a diferencia
// de MAL/Jikan que lo deja null hasta que el manga termina).
// Un solo request cubre ambos pasos gracias a include=item.
async function _srcKitsu(malId, title){
  if(!malId) return 0;
  try{
    // Método principal: mapping MAL ID → Kitsu con chapterCount incluido
    const url=`https://kitsu.io/api/edge/mappings?filter[externalSite]=myanimelist/manga&filter[externalId]=${malId}&include=item&fields[manga]=chapterCount,status`;
    const res=await fetch(url,{
      headers:{"Accept":"application/vnd.api+json","Content-Type":"application/vnd.api+json"}
    });
    if(res.ok){
      const json=await res.json();
      // chapterCount viene en included[0].attributes
      const included=json?.included||[];
      for(const it of included){
        if(it?.type==="manga"){
          const cnt=it?.attributes?.chapterCount;
          if(cnt&&cnt>0) return cnt;
        }
      }
      // Si included está vacío, buscar via relationships
      const data=json?.data||[];
      if(data.length){
        const kitsuId=data[0]?.relationships?.item?.data?.id;
        if(kitsuId){
          // Segundo request: pedir el manga directamente
          const res2=await fetch(`https://kitsu.io/api/edge/manga/${kitsuId}?fields[manga]=chapterCount,status`,{
            headers:{"Accept":"application/vnd.api+json"}
          });
          if(res2.ok){
            const j2=await res2.json();
            const cnt=j2?.data?.attributes?.chapterCount;
            if(cnt&&cnt>0) return cnt;
          }
        }
      }
    }
  }catch(e){}
  // Fallback: búsqueda por título si el mapping no existe en Kitsu
  if(!title) return 0;
  try{
    const q=encodeURIComponent(title.slice(0,60));
    const url2=`https://kitsu.io/api/edge/manga?filter[text]=${q}&page[limit]=5&fields[manga]=chapterCount,status,canonicalTitle,titles`;
    const res2=await fetch(url2,{headers:{"Accept":"application/vnd.api+json"}});
    if(!res2.ok) return 0;
    const items=(await res2.json())?.data||[];
    // Normalizar títulos para comparación
    const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const titleNorm=norm(title);
    for(const it of items){
      const attrs=it?.attributes||{};
      const kitsuTitles=[
        attrs.canonicalTitle,
        attrs.titles?.en,
        attrs.titles?.en_jp,
        attrs.titles?.ja_jp
      ].filter(Boolean);
      // Solo aceptar si algún título coincide razonablemente
      const match=kitsuTitles.some(t=>norm(t)===titleNorm||norm(t).includes(titleNorm)||titleNorm.includes(norm(t)));
      if(match){
        const cnt=attrs.chapterCount;
        if(cnt&&cnt>0) return cnt;
      }
    }
  }catch(e){}
  return 0;
}
// ── Fuente 3: AniList GraphQL ─────────────────────────────────────────────────
async function _srcAniList(malId, type){
  try{
    const mediaType=type==="manga"?"MANGA":"ANIME";
    // Para manga en emisión: pedir chapters (puede ser null) + status
    // Para anime en emisión: nextAiringEpisode da el ep actual con precisión
    const fields=type==="manga"
      ?"chapters volumes status"
      :"episodes status nextAiringEpisode{episode}";
    const query=`{Media(idMal:${malId},type:${mediaType}){${fields}}}`;
    const res=await fetch("https://graphql.anilist.co",{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({query})
    });
    if(!res.ok) return 0;
    const json=await res.json();
    const media=json?.data?.Media;
    if(!media) return 0;
    if(type==="manga") return media.chapters||0;
    if(media.nextAiringEpisode?.episode>0) return media.nextAiringEpisode.episode-1;
    return media.episodes||0;
  }catch(e){return 0;}
}

// ── Fuente 4: MangaDex — obtener MangaDex UUID a partir de MAL ID ─────────────
// Retorna el UUID de MangaDex o null si no se encuentra
async function _mdxGetId(malId, title){
  // Intento 1: búsqueda directa por MAL ID (más precisa)
  try{
    const url="https://api.mangadex.org/manga?"+
      "links%5Bmal%5D="+encodeURIComponent(String(malId))+"&limit=5&includes%5B%5D=none"+
      "&contentRating%5B%5D=safe&contentRating%5B%5D=suggestive"+
      "&contentRating%5B%5D=erotica&contentRating%5B%5D=pornographic";
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    if(res.ok){
      const items=(await res.json())?.data||[];
      if(items.length) return items[0].id;
    }
  }catch(e){}
  // Intento 2: búsqueda por título con match de MAL ID en links
  if(!title) return null;
  try{
    const q=encodeURIComponent((title||"").slice(0,80));
    const url=`https://api.mangadex.org/manga?title=${q}&limit=20&includes[]=none`+
      `&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica&contentRating[]=pornographic`+
      `&order[relevance]=desc`;
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    if(!res.ok) return null;
    const items=(await res.json())?.data||[];
    const malStr=String(malId);
    // Preferir match exacto por MAL ID
    for(const it of items){
      if(String(it?.attributes?.links?.mal||"")===malStr) return it.id;
    }
    // Fallback: primer resultado
    return items[0]?.id||null;
  }catch(e){return null;}
}

// ── Fuente 4b: MangaDex aggregate — capítulos publicados (todas las traducciones) ──
async function _mdxAggregate(mdxId){
  try{
    const aggRes=await fetch(`https://api.mangadex.org/manga/${mdxId}/aggregate`,
      {headers:{"Accept":"application/json"}});
    if(!aggRes.ok) return 0;
    const vols=(await aggRes.json())?.volumes||{};
    let max=0;
    // CRÍTICO: NO filtrar el volumen "none" — contiene los caps más recientes
    // en emisión que aún no tienen volumen asignado (ej: Dandadan cap. 200+).
    // Solo filtrar "none"/"" en las claves de capítulos individuales.
    for(const vol of Object.values(vols)){
      for(const k of Object.keys(vol?.chapters||{})){
        if(k==="none"||k===""||k==="null") continue; // solo filtrar cap keys inválidas
        const n=parseFloat(k);
        if(!isNaN(n)&&n>max) max=n;
      }
    }
    return max>0?Math.floor(max):0;
  }catch(e){return 0;}
}

// ── Fuente 4c: MangaDex feed japonés — capítulo más reciente en JP original ──
// Esta es la fuente más fiable para manga en emisión:
// retorna el capítulo original japonés (o japonés-romaji) más reciente publicado.
// Funciona incluso cuando no hay scanlations en inglés.
async function _mdxFeedLatestJP(mdxId){
  try{
    // limit=10: salta caps bonus/especiales con chapter=null que aparecen primero
    const url=`https://api.mangadex.org/manga/${mdxId}/feed`+
      `?translatedLanguage[]=ja&translatedLanguage[]=ja-ro`+
      `&order[chapter]=desc&limit=10&includes[]=none`+
      `&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica&contentRating[]=pornographic`;
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    if(!res.ok) return 0;
    const data=(await res.json())?.data||[];
    for(const entry of data){
      const chStr=entry?.attributes?.chapter;
      if(!chStr||chStr==="none"||chStr==="") continue;
      const n=parseFloat(chStr);
      if(Number.isFinite(n)&&n>0) return Math.floor(n);
    }
    return 0;
  }catch(e){return 0;}
}

// ── Fuente 4d: MangaDex feed multi-idioma — fallback si JP no tiene datos ──
// Busca el capítulo más alto publicado en cualquier idioma (en, es, pt-br, fr, etc.)
// Útil para webtoons y manga que solo tienen scanlation sin raw japonés en MangaDex.
async function _mdxFeedLatestAny(mdxId){
  try{
    // limit=10: salta caps bonus/especiales con chapter=null que aparecen primero
    const url=`https://api.mangadex.org/manga/${mdxId}/feed`+
      `?order[chapter]=desc&limit=10&includes[]=none`+
      `&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica&contentRating[]=pornographic`;
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    if(!res.ok) return 0;
    const data=(await res.json())?.data||[];
    for(const entry of data){
      const chStr=entry?.attributes?.chapter;
      if(!chStr||chStr==="none"||chStr==="") continue;
      const n=parseFloat(chStr);
      if(Number.isFinite(n)&&n>0) return Math.floor(n);
    }
    return 0;
  }catch(e){return 0;}
}

// ── Fuente 4 (orquestador MangaDex) ──────────────────────────────────────────
// Obtiene el UUID y luego prueba: feed JP → aggregate → feed cualquier idioma
async function _srcMangaDex(malId, title){
  try{
    const mdxId=await _mdxGetId(malId,title);
    if(!mdxId) return 0;

    // Prioridad: lastChapter del metadata (si existe = manga finalizado)
    // Para manga en emisión lastChapter es null, así que pasamos directo a feed
    const [feedJP, agg, feedAny]=await Promise.all([
      _mdxFeedLatestJP(mdxId),
      _mdxAggregate(mdxId),
      _mdxFeedLatestAny(mdxId)
    ]);
    return Math.max(feedJP||0, agg||0, feedAny||0);
  }catch(e){return 0;}
}

// ── Fuente 5: MangaDex por MAL ID directo (alias simplificado) ───────────────
async function _srcMangaDexByMalId(malId){
  try{
    const url="https://api.mangadex.org/manga?"+
      "links%5Bmal%5D="+encodeURIComponent(String(malId))+"&limit=5&includes%5B%5D=none"+
      "&contentRating%5B%5D=safe&contentRating%5B%5D=suggestive"+
      "&contentRating%5B%5D=erotica&contentRating%5B%5D=pornographic";
    const res=await fetch(url,{headers:{"Accept":"application/json"}});
    if(!res.ok) return 0;
    const items=(await res.json())?.data||[];
    if(!items.length) return 0;
    const it=items[0];
    const mdxId=it.id;

    // lastChapter disponible (manga finalizado)
    const lc=it.attributes?.lastChapter;
    if(lc&&lc!=="none"&&lc!==""&&lc!==null&&lc!=="null"){
      const n=Math.floor(parseFloat(lc));
      if(n>0) return n;
    }

    // Para manga en emisión: feed japonés → aggregate → feed cualquier idioma
    const [feedJP, agg, feedAny]=await Promise.all([
      _mdxFeedLatestJP(mdxId),
      _mdxAggregate(mdxId),
      _mdxFeedLatestAny(mdxId)
    ]);
    return Math.max(feedJP||0, agg||0, feedAny||0);
  }catch(e){return 0;}
}

// ── Orquestador manga: Kitsu primero, MangaDex feed JP como fallback ──────────
// Lógica simplificada: 2 fuentes secuenciales con timeout corto (4s cada una).
// Eliminadas: Jikan paged (parseo frágil), AniList (retorna null para manga en
// emisión), _srcMangaDex y _srcMangaDexByMalId (duplicados con sub-requests).
// Para anime en emisión el flujo sigue igual (AniList nextAiringEpisode).
async function _getMangaCount(malId, title, rawCount){
  // ── Diagnóstico y solución ───────────────────────────────────────────────────
  // AniList/MAL/Kitsu retornan chapters=null para manga en emisión por diseño.
  // La fuente correcta es MangaDex (agregador activo). Se usan 3 vías en paralelo:
  //
  // 1. _srcMangaDexByMalId: lookup por links[mal] → feed JP + aggregate + feed any
  //    Bug fix: aggregate ya NO descarta el volumen "none" que contiene los caps
  //    más recientes sin volumen asignado (ej: Dandadan 200+, Frieren 120+).
  //
  // 2. _srcMangaDex: lookup por título → mismo pipeline
  //    Cubre el ~20% de títulos sin link MAL en MangaDex.
  //
  // 3. _srcJikanPaged: red de seguridad para manhwa/webtoons fuera de MangaDex.

  const T = 7000;
  const t = ms => new Promise(r => setTimeout(()=>r(0), ms));

  const [mdxById, mdxByTitle, paged] = await Promise.all([
    Promise.race([_srcMangaDexByMalId(malId), t(T)]),
    Promise.race([_srcMangaDex(malId, title), t(T)]),
    Promise.race([_srcJikanPaged(malId, "manga"), t(T)])
  ]);

  const best = Math.max(rawCount||0, mdxById||0, mdxByTitle||0, paged||0);
  if(best > 0) return best;

  // Último recurso: Jikan individual (útil solo para manga finalizado)
  try{
    const jd = await Promise.race([
      _jikanFetch("https://api.jikan.moe/v4/manga/" + malId),
      t(4000)
    ]);
    const cnt = jd?.data?.chapters||0;
    if(cnt > 0) return Math.max(rawCount||0, cnt);
  }catch(e){}

  return rawCount||0;
}


async function getBestCount(malId, type, rawCount, title){
  const T=4000;
  const t=ms=>new Promise(r=>setTimeout(()=>r(0),ms));
  if(type==="manga"){
    return _getMangaCount(malId,title,rawCount);
  }else{
    const [j1,j2,al]=await Promise.all([
      Promise.race([_srcJikanIndividual(malId,"anime"),t(T)]),
      Promise.race([_srcJikanPaged(malId,"anime"),t(T)]),
      Promise.race([_srcAniList(malId,"anime"),t(T)])
    ]);
    return Math.max(rawCount||0,j1||0,j2||0,al||0);
  }
}

// Compatibilidad con llamadas existentes a jikanGetLatestCount
async function jikanGetLatestCount(malId, type, fast=false){
  const j1=await _srcJikanIndividual(malId,type);
  if(j1>0) return j1;
  return _srcJikanPaged(malId,type);
}

function jikanExtractPublishedNumber(entry,type){
  if(!entry)return 0;
  const toPosInt=v=>{
    const n=Number(v);
    return Number.isFinite(n)&&n>0?Math.floor(n):0;
  };
  // Jikan v4 /chapters endpoint devuelve el número en campo "chapter" (string) o en el título
  // NOTA: entry.mal_id es el ID del registro en MAL, no el número de capítulo — excluido.
  const direct=type==="manga"
    ? [entry.chapter,entry.chapters,entry.number,entry.no]
    : [entry.episode,entry.episodes,entry.number,entry.no];
  for(const v of direct){
    const n=toPosInt(v);
    if(n>0)return n;
  }
  const txt=String(entry.title||entry.name||entry.title_english||"");
  const tagged=txt.match(/\b(?:chapter|cap(?:[ií]tulo)?|episode|ep)\s*\.?\s*#?\s*(\d+(?:\.\d+)?)/i);
  if(tagged&&tagged[1]){
    const n=toPosInt(parseFloat(tagged[1]));
    if(n>0)return n;
  }
  const loose=txt.match(/(\d+(?:\.\d+)?)/);
  if(loose&&loose[1]){
    const n=toPosInt(parseFloat(loose[1]));
    if(n>0)return n;
  }
  return 0;
}

// Controlador de búsqueda activa para cancelar peticiones en vuelo (Fix #3 + #11)
let _jikanSearchAbort=null;

async function searchJikan(query,tabType){
  if(!query||query.length<2){jikanResults=[];removeJikanDrop();return;}
  if(_jikanSearchAbort){_jikanSearchAbort.abort();_jikanSearchAbort=null;}
  const ctrl=new AbortController();
  _jikanSearchAbort=ctrl;
  const searchType=tabType;
  const ep=searchType==="manga"?"manga":"anime";
  try{
    const res=await fetch(`https://api.jikan.moe/v4/${ep}?q=${encodeURIComponent(query)}&limit=20`,{signal:ctrl.signal});
    if(ctrl.signal.aborted)return;
    if(!res.ok){jikanResults=[];return;}
    const json=await res.json();
    const raw=(json.data||[]);

    // ── FILTRO 1: excluir OVAs, películas, especiales, música ──────────────────
    // Solo queremos TV (temporadas canónicas) y manga principal (no doujin, one-shot)
    const EXCLUDED_TYPES_ANIME=new Set(["OVA","Movie","Special","ONA","Music","CM","PV"]);
    const EXCLUDED_TYPES_MANGA=new Set(["Doujin","One-shot","Novel","Light Novel"]);
    const filtered=raw.filter(item=>{
      const t=(item.type||"").trim();
      if(searchType==="anime") return !EXCLUDED_TYPES_ANIME.has(t);
      if(searchType==="manga") return !EXCLUDED_TYPES_MANGA.has(t);
      return true;
    });

    // ── FILTRO 2: relevancia mínima — excluir resultados claramente no relacionados ──
    // Jikan ordena por relevancia pero puede colar series sin relación al final
    const queryNorm=query.trim().toLowerCase().replace(/[!！]/g,"").replace(/\s+/g," ");
    const relevantFiltered=filtered.filter(item=>{
      const en=(item.title_english||"").toLowerCase().replace(/[!！]/g,"");
      const ja=(item.title||"").toLowerCase().replace(/[!！]/g,"");
      const enSyn=(item.title_synonyms||[]).join(" ").toLowerCase();
      // Mantener si el query aparece en cualquier variante del título
      return en.includes(queryNorm)||ja.includes(queryNorm)||enSyn.includes(queryNorm)
        ||queryNorm.includes(en.slice(0,Math.max(4,en.length-4)))
        ||(item.score&&item.score>7&&(en.startsWith(queryNorm)||ja.startsWith(queryNorm)));
    });
    // Si el filtro elimina todo, usar los originales (búsqueda muy específica)
    const workList=relevantFiltered.length>0?relevantFiltered:filtered;

    // ── AGRUPACIÓN por título japonés ────────────────────────────────────────────
    // Estrategia: el título japonés es la clave más estable entre temporadas.
    // "ハイキュー!!" es idéntico en T1, T2, T3, T4 — pero el título inglés
    // ("Haikyu!! To the Top", "Haikyu!! Final Arc") varía por subtítulos narrativos.
    // Para series sin título japonés (raras) o western, usar inglés como fallback.
    //
    // Limpieza del base: quitar números de temporada, subtítulos de cour, sufijos
    // narrativos conocidos, y cualquier cosa después de "::" o "—".
    function _baseTitle(t){
      return (t||"")
        // Patrones de temporada explícitos
        .replace(/\s*[:·]\s*(season|part|cour|temporada)\s*[\dIVX]+.*/i,"")
        .replace(/\s*(2nd|3rd|4th|5th|6th|\d+th|second|third|fourth|fifth|sixth)\s+(season|cour|part).*/i,"")
        .replace(/\s*season\s*[\dIVX]+.*/i,"")
        .replace(/\s*\d+(st|nd|rd|th)\s*season.*/i,"")
        .replace(/\s*:\s*(the\s+)?(final|last|first|new)\s+(season|chapter|arc|stage|war|part).*/i,"")
        .replace(/\s*\(?season\)?.*/i,"")
        // Patrones de cour y partes
        .replace(/\s*[\-:]\s*\d+(st|nd|rd|th)[\-\s]*cour.*/i,"")
        .replace(/\s+\d+(st|nd|rd|th)[\-\s]*cour.*/i,"")
        .replace(/\s*:?\s*(final arc|the final|the beginning|new generation|next generation).*/i,"")
        // Subtítulos narrativos de Haikyu y similares
        .replace(/\s*:?\s*(to the top|to the next|vs\..+).*/i,"")
        // Números romanos al final (II, III, IV…) — no I solo (falsos positivos)
        .replace(/\s+[IVX]{2,4}$/,"")
        // Número suelto al final "Bleach 2", "Naruto 4"
        .replace(/\s+\d+$/,"")
        .trim().toLowerCase();
    }

    // Para el display mostrar siempre el título inglés si existe, o japonés transliterado
    const seen=new Map(); // base → index en deduped
    const deduped=[];
    for(const item of workList){
      const titleEn=(item.title_english||"").trim();
      const titleJa=(item.title||"").trim();
      // Clave de agrupación: título japonés primero (más estable entre temporadas),
      // fallback a inglés si no hay japonés
      const keyForGrouping=titleJa||titleEn;
      const base=_baseTitle(keyForGrouping);
      const itemEps=searchType==="manga"?(item.chapters||0):(item.episodes||0);
      const isAiring=searchType==="manga"?item.publishing:item.airing;
      if(!seen.has(base)){
        if(deduped.length<6){
          seen.set(base,deduped.length);
          const cloned=Object.assign({},item);
          if(titleEn) cloned._displayTitle=titleEn;
          cloned._accEps=itemEps;
          cloned._seasonCount=1;
          cloned._anyAiring=isAiring||false;
          cloned._latestMalId=item.mal_id;
          deduped.push(cloned);
        } else seen.set(base,-1);
      } else {
        const idx=seen.get(base);
        if(idx>=0&&deduped[idx]){
          deduped[idx]._accEps=(deduped[idx]._accEps||0)+itemEps;
          deduped[idx]._seasonCount=(deduped[idx]._seasonCount||1)+1;
          if(isAiring){
            deduped[idx]._anyAiring=true;
            deduped[idx].airing=true;
            deduped[idx]._latestMalId=item.mal_id;
          }
        }
      }
    }
    jikanResults=deduped;
  }catch(e){
    if(!ctrl.signal.aborted)jikanResults=[];
    return;
  }
  if(ctrl.signal.aborted)return;

  // Mostrar dropdown inmediatamente con lo que tiene Jikan
  renderJikanDrop(searchType);

  // Enriquecer items con conteo real — estrategia diferenciada por tipo:
  //
  // MANGA: MangaDex no tiene rate limit estricto → paralelismo total (todos a la vez).
  //   Cada item lanza _getMangaCount independientemente y actualiza el dropdown
  //   tan pronto llega su resultado. El usuario ve los números aparecer de a uno
  //   en ~2-5s en lugar de esperar 6×(API+400ms) = ~15s+.
  //
  // ANIME: Jikan tiene rate limit de 3 req/s → concurrencia 1 + pausa 400ms.
  //   Se mantiene el flujo secuencial original para no recibir 429.

  const snap=[...jikanResults];

  async function _enrichItem(item){
    if(ctrl.signal.aborted)return;
    if(!item.mal_id)return;
    const rawCnt=searchType==="manga"?(item.chapters||0):(item.episodes||0);
    const title=item._displayTitle||item.title_english||item.title||'';
    const isMultiSeason=(item._seasonCount||1)>1;
    const isAiring=searchType==="manga"?item.publishing:item.airing;
    let best=0;
    try{
      if(searchType==="manga"){
        // Manga: siempre _getMangaCount (MangaDex links[mal] → feed JP/any → Jikan)
        best=await _getMangaCount(item.mal_id,title,rawCnt);
      }else if(isMultiSeason&&isAiring&&item._latestMalId){
        const prevSeasonEps=(item._accEps||0)-(rawCnt||0);
        const latestEps=await _srcAniList(item._latestMalId,searchType);
        const latestBest=latestEps>0?latestEps:rawCnt||0;
        best=prevSeasonEps+latestBest;
      }else if(isMultiSeason&&!isAiring){
        best=item._accEps||rawCnt||0;
        const alTotal=await _srcAniList(item.mal_id,searchType);
        if(alTotal>best) best=alTotal;
      }else{
        best=await getBestCount(item.mal_id,searchType,rawCnt,title);
        if(!best){
          try{best=await jikanGetLatestCount(item.mal_id,searchType,false);}catch(e2){}
        }
      }
    }catch(e){}
    if(ctrl.signal.aborted)return;
    const live=jikanResults.find(x=>x.mal_id===item.mal_id);
    if(!live)return;
    live._latestChapter=best;
    renderJikanDrop(searchType);
  }

  if(searchType==="manga"){
    // Manga: todos en paralelo — MangaDex no tiene rate limit como Jikan
    await Promise.all(snap.map(item=>_enrichItem(item)));
  }else{
    // Anime: secuencial con pausa para respetar rate limit de Jikan (3 req/s)
    const sortedAnime=[
      ...snap.filter(x=>x.airing),
      ...snap.filter(x=>!x.airing)
    ];
    for(let i=0;i<sortedAnime.length;i++){
      if(ctrl.signal.aborted)return;
      await _enrichItem(sortedAnime[i]);
      if(i<sortedAnime.length-1&&!ctrl.signal.aborted){
        await new Promise(r=>setTimeout(r,400));
      }
    }
  }
  _jikanSearchAbort=null;
}

function _jikanCountHTML(item, tab_){
  const rawCount=tab_==="manga"?(item.chapters||0):(item.episodes||0);
  // Usar _anyAiring: es true si CUALQUIER temporada del grupo está en emisión
  const pub=tab_==="manga"?item.publishing:(item._anyAiring||item.airing);
  const chapLabel=tab_==="manga"?"Cap.":"Ep.";
  const enrichmentDone = item._latestChapter !== undefined;
  const hasMultiSeasons=(item._seasonCount||1)>1;
  // Prioridad de conteo:
  // 1) _latestChapter: resultado del enrichment async (fuente más precisa)
  // 2) _accEps: solo si el enrichment ya terminó (evitar mostrar número pre-OVA-filtrado)
  // 3) rawCount: lo que vino de Jikan directamente (solo para series de 1 temporada)
  let displayCount=0;
  if(item._latestChapter>0){
    displayCount=item._latestChapter;
  }else if(enrichmentDone){
    // Enrichment terminó pero devolvió 0 — no mostrar _accEps (puede estar inflado)
    displayCount=0;
  }else if(!hasMultiSeasons&&rawCount>0){
    // Serie de 1 temporada: mostrar rawCount mientras se carga
    displayCount=rawCount;
  }
  // Para multi-temporada sin enriquecimiento aún: no mostrar número (puede estar mal)
  if(displayCount>0){
    const label=pub
      ? `${chapLabel} <b>${displayCount}</b> <span style="opacity:.55;font-size:8px">últ.</span>`
      : `${chapLabel} ${displayCount}${hasMultiSeasons&&!pub?`<span style="opacity:.4;font-size:8px;margin-left:2px"> (${item._seasonCount} temp.)</span>`:""}`;
    return `<span class="jikan-chapters-count">${label}</span>`;
  }else if(!enrichmentDone){
    return `<span class="jikan-count-pending" style="font-size:9px;color:var(--t2);font-family:Space Mono,monospace;opacity:.7">buscando...</span>`;
  }else{
    return `<span style="font-size:9px;color:var(--t3);font-family:Space Mono,monospace">sin dato</span>`;
  }
}

function renderJikanDrop(tabType){
  const wrap=document.querySelector(".jikan-wrap");
  if(!wrap)return;
  const tab_=tabType||tab;

  // ── Actualización quirúrgica: si el dropdown ya existe, solo parchear celdas de conteo ──
  // Evita destruir el DOM y que el input pierda foco durante el enriquecimiento async
  const existingDrop=document.getElementById("jikan-drop");
  if(existingDrop){
    jikanResults.forEach(item=>{
      if(!item.mal_id)return;
      // Solo actualizar si el enriquecimiento ya terminó (evitar parpadeos intermedios)
      if(item._latestChapter===undefined)return;
      const row=existingDrop.querySelector(`[data-malid="${item.mal_id}"]`);
      if(!row)return;
      const meta=row.querySelector(".jikan-meta");
      if(!meta)return;
      // Reemplazar solo el nodo de conteo preservando badge y año
      const pending=meta.querySelector(".jikan-count-pending");
      const countEl=meta.querySelector(".jikan-chapters-count");
      const targetEl=pending||countEl;
      if(targetEl){
        const newHTML=_jikanCountHTML(item,tab_);
        const tmp=document.createElement("span");
        tmp.innerHTML=newHTML;
        targetEl.replaceWith(tmp.firstChild);
      }
    });
    return;
  }

  // ── Construcción inicial del dropdown ──
  if(!jikanResults.length)return;
  const drop=document.createElement("div");
  drop.className="jikan-drop";
  drop.id="jikan-drop";
  jikanResults.forEach(item=>{
    const row=document.createElement("div");
    row.className="jikan-item";
    row.setAttribute("data-malid", item.mal_id||"");
    const thumb=item.images?.jpg?.image_url||"";
    // Usar _anyAiring para el badge: refleja si cualquier temporada del grupo está activa
    const pub=tab_==="manga"?item.publishing:(item._anyAiring||item.airing);
    const _getYear=str=>str?new Date(str).getFullYear()||null:null;
    const yearStart=(item.published?.prop?.from?.year)||(item.aired?.prop?.from?.year)||_getYear(item.published?.from)||_getYear(item.aired?.from)||null;
    const yearEnd=(item.published?.prop?.to?.year)||(item.aired?.prop?.to?.year)||_getYear(item.published?.to)||_getYear(item.aired?.to)||null;
    let yearHTML="";
    if(yearStart){
      yearHTML=pub
        ?`<span style="font-size:9px;color:var(--t3);margin-left:4px">${yearStart}–</span>`
        :yearEnd&&yearEnd!==yearStart
          ?`<span style="font-size:9px;color:var(--t3);margin-left:4px">${yearStart}–${yearEnd}</span>`
          :`<span style="font-size:9px;color:var(--t3);margin-left:4px">${yearStart}</span>`;
    }
    const countHTML=_jikanCountHTML(item,tab_);
    const badgeHTML=pub
      ?`<span class="jikan-badge pub"><span class="jikan-dot"></span>En emisión</span>`
      :`<span class="jikan-badge fin">✓ Finalizado</span>`;
    // Mostrar título en inglés si está disponible (_displayTitle), sino el original
    const displayTitle=item._displayTitle||item.title_english||item.title;
    row.innerHTML=`${thumb?`<img class="jikan-thumb" src="${thumb}" loading="lazy">`:`<div class="jikan-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--t3)">?</div>`}<div class="jikan-info"><div class="jikan-title">${displayTitle}</div><div class="jikan-meta">${countHTML}${badgeHTML}${yearHTML}</div></div>`;
    row.onclick=()=>{selectJikanResult(item,tab_);removeJikanDrop();};
    drop.appendChild(row);
  });
  wrap.appendChild(drop);
}

          const hiddenInp=document.getElementById("add-total");
          if(hiddenInp)hiddenInp.value="0";
        }
      }
    })();
  }
}

async function checkJikanUpdates(){
  let anyUpdated = false;
  for(const tabKey of ["manga","anime"]){
    const ep=tabKey==="manga"?"manga":"anime";
    const publishing=data[tabKey].filter(s=>s.jikanId&&s.jikanPublishing);
    for(const series of publishing){
      try{
        // Obtener mejor conteo con todas las fuentes disponibles
        let stillPub = true;
        let count = 0;
        try{
          // Primero: Jikan endpoint individual para verificar estado de publicación
          const json=await _jikanFetch(`https://api.jikan.moe/v4/${ep}/${series.jikanId}`);
          if(json){
            const jkCnt=tabKey==="manga"?json.data?.chapters:json.data?.episodes;
            stillPub=tabKey==="manga"?(json.data?.publishing!==false):(json.data?.airing!==false);
            count=jkCnt||0;
          }
        }catch(e1){}
        // Si Jikan endpoint individual no trae número (típico en manga/anime en emisión),
        // usar la función específica por tipo.
        if(!count || count<1){
          try{
            if(tabKey==="manga"){
              // Para manga: Kitsu → MangaDex feed JP (2 fuentes, secuencial, rápido)
              const best=await _getMangaCount(series.jikanId,series.title,0);
              if(best>0) count=best;
            }else{
              const best=await getBestCount(series.jikanId,tabKey,0,series.title);
              if(best>0) count=best;
            }
          }catch(e2){
            if(tabKey==="anime"){
              const alCnt=await _srcAniList(series.jikanId,tabKey);
              if(alCnt>0) count=alCnt;
            }
          }
        }
        // FIX BUG #4+: shouldUpdate — actualizar cuando count > total
        // FIX EXTRA: si total era 0 (serie recién agregada en emisión), asignar el primer conteo
        const shouldUpdate=count>0&&count>series.total;
        const noTotalYet=count>0&&(!series.total||series.total===0||series.total===1);
        if(shouldUpdate||noTotalYet){
          series.total=count;
          series.jikanPublishing=stillPub;
          series.lastUpdated=Date.now();
          anyUpdated=true;
          if(shouldUpdate&&!noTotalYet) showToast(`🆕 ${series.title}: ${count} ${tabKey==="manga"?"cap.":"ep."} disponibles`,4000);
        }else if(!stillPub&&series.jikanPublishing){
          series.jikanPublishing=false;
          if(count>0&&count>series.total){series.total=count;}
          anyUpdated=true;
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,400));// Jikan rate limit: 3 req/s
    }
  }
  if(anyUpdated){ save(); render(); }
}

function p29PlayTick(){
  try{
    if(!_p29AudioCtx){_p29AudioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    if(theme.soundEnabled===false)return;
    const ctx=_p29AudioCtx;const now=ctx.currentTime;
    const notes=[880,1108,1320];
    notes.forEach((freq,i)=>{
      const osc=ctx.createOscillator();const gain=ctx.createGain();const filter=ctx.createBiquadFilter();
      filter.type="lowpass";filter.frequency.value=3000;
      osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
      osc.type="sine";osc.frequency.setValueAtTime(freq,now+i*0.045);
      const vol=i===0?0.18:i===1?0.12:0.08;
      gain.gain.setValueAtTime(0,now+i*0.045);
      gain.gain.linearRampToValueAtTime(vol,now+i*0.045+0.012);
      gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.045+0.38);
      osc.start(now+i*0.045);osc.stop(now+i*0.045+0.4);
    });
    const sub=ctx.createOscillator();const subGain=ctx.createGain();
    sub.connect(subGain);subGain.connect(ctx.destination);sub.type="sine";
    sub.frequency.setValueAtTime(220,now);subGain.gain.setValueAtTime(0.04,now);
    subGain.gain.exponentialRampToValueAtTime(0.001,now+0.25);sub.start(now);sub.stop(now+0.28);
  }catch(e){}
}

function p29PlayCompleteSound(){

      [a,b,c].forEach(freq=>{
        const osc=ctx.createOscillator();const gain=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc.type="sine";osc.frequency.setValueAtTime(freq,now+0.3+wave*0.18);
        gain.gain.setValueAtTime(0.14,now+0.3+wave*0.18);
        gain.gain.exponentialRampToValueAtTime(0.001,now+0.3+wave*0.18+0.55);
        osc.start(now+0.3+wave*0.18);osc.stop(now+0.3+wave*0.18+0.6);

function p29PlayUpToDateSound(){
  // Sonido de "al día": 2 notas cortas ascendentes + shimmer
  try{
    if(!_p29AudioCtx){_p29AudioCtx=new(window.AudioContext||window.webkitAudioContext)();}
    if(theme.soundEnabled===false)return;
    const ctx=_p29AudioCtx;const now=ctx.currentTime;
    [880,1320,1760].forEach((freq,i)=>{
      const osc=ctx.createOscillator();const gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type="sine";osc.frequency.setValueAtTime(freq,now+i*0.08);
      gain.gain.setValueAtTime(0.16,now+i*0.08);
      gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.22);
      osc.start(now+i*0.08);osc.stop(now+i*0.08+0.25);
    });
  }catch(e){}
}

// ── ANIMACIÓN DOPAMINA MEJORADA ──
function p28ShowPlusAnim(type, title, streakCount, isGoalHit, isComplete, isUpToDate){
  document.querySelectorAll(".p28-anim-overlay,.p28-particle,.p28-ring").forEach(e=>e.remove());
  const colors=type==="manga"
    ?["#63b3ed","#9b7dff","#34d399","#7ecbff","#fbbf24","#f472b6"]
    :["#68d391","#34d399","#63b3ed","#fbbf24","#a78bfa","#fb923c"];
  const mc=colors[0];

  let mainText="+1";let subText=type==="manga"?"📖 cap":"▶ ep";
  let mainColor=mc;let extraLines="";let particleCount=22;let ringCount=2;

  if(isComplete){
    mainText="🎉";subText="¡COMPLETADO!";mainColor="#fbbf24";
    extraLines=`<div style="color:#fbbf24;font-size:11px;font-weight:700;margin-top:4px;animation:p28Sub .6s ease forwards;animation-delay:.15s;opacity:0">${title.length>20?title.slice(0,20)+"…":title}</div>`;
    particleCount=55;ringCount=4;
  } else if(isGoalHit){
    mainText="🎯";subText="¡META DIARIA!";mainColor="#f59e0b";
    extraLines=`<div style="color:#fbbf24;font-size:11px;font-weight:700;margin-top:4px;animation:p28Sub .6s ease forwards;animation-delay:.15s;opacity:0">¡Objetivo cumplido!</div>`;
    particleCount=40;ringCount=3;
  } else if(isUpToDate){
    mainText="✓";subText="¡AL DÍA!";mainColor="#34d399";
    extraLines=`<div style="color:#34d399;font-size:10px;font-weight:600;margin-top:4px;animation:p28Sub .6s ease forwards;animation-delay:.15s;opacity:0">${title.length>22?title.slice(0,22)+"…":title}</div>`;
    particleCount=35;ringCount=3;
  }

  const streakLine=(streakCount>=2&&!isComplete&&!isGoalHit)
    ?`<div style="color:#fbbf24;font-size:11px;font-weight:700;animation:p28Sub .75s ease forwards;animation-delay:.2s;opacity:0;font-family:'Space Mono',monospace">🔥 ${streakCount} días</div>`
    :"";

  const ov=document.createElement("div");
  ov.className="p28-anim-overlay";
  const scale=isComplete?"1.5":isGoalHit?"1.3":"1";
  ov.innerHTML=`<div class="p28-plus-main" style="color:${mainColor};transform:scale(${scale})">${mainText}</div><div class="p28-plus-sub" style="color:${mainColor};border:1px solid ${mainColor}44">${subText}</div>${extraLines}${streakLine}`;
  document.body.appendChild(ov);

  const cx=window.innerWidth/2,cy=window.innerHeight/2;
  for(let ri=0;ri<ringCount;ri++){
    const ring=document.createElement("div");
    ring.className="p28-ring";
    const sz=120+ri*90;
    ring.style.cssText=`left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;color:${colors[ri%colors.length]};animation-delay:${ri*75}ms`;
    document.body.appendChild(ring);
  }
  for(let i=0;i<particleCount;i++){
    const p=document.createElement("div");
    p.className="p28-particle";
    const angle=(i/particleCount)*360+(Math.random()-0.5)*25;
    const dist=(isComplete||isGoalHit?100:70)+Math.random()*100;
    const px=Math.cos(angle*Math.PI/180)*dist+"px";
    const py=Math.sin(angle*Math.PI/180)*dist+"px";
    const isRect=i%3===0;
    const sz=isRect?`width:${4+Math.random()*5}px;height:${8+Math.random()*10}px;border-radius:2px`:`width:${5+Math.random()*6}px;height:${5+Math.random()*6}px;border-radius:50%`;
    const rot=(Math.random()*360)+"deg";
    p.style.cssText=`left:${cx}px;top:${cy}px;${sz};--px:${px};--py:${py};--rot:${rot};background:${colors[i%colors.length]};animation-delay:${Math.random()*80}ms;transform-origin:center`;
    document.body.appendChild(p);
  }
  const dur=isComplete||isGoalHit?1400:950;
  setTimeout(()=>{ov.remove();document.querySelectorAll(".p28-particle,.p28-ring").forEach(e=>e.remove());},dur);
}

function p29BumpGoal(){
  const td=today();const d=p29GetGoalData();
  if(d.lastDate!==td){d.todayCount=0;d.lastDate=td;}
  const prevCount=d.todayCount||0;
  d.todayCount=prevCount+1;
  p29SaveGoalData(d);
  const goalFill=document.querySelector(".daily-goal-fill");
  const goalCount=document.querySelector(".daily-goal-count");
  if(goalFill){const pct=Math.round(Math.min(d.todayCount,d.goal)/d.goal*100);goalFill.style.width=pct+"%";}
  if(goalCount){goalCount.textContent=Math.min(d.todayCount,d.goal)+" / "+d.goal+" hoy";}
  // Exactamente al llegar al objetivo
  if(d.todayCount===d.goal){
    setTimeout(()=>{
      p29PlayGoalSound();
      p29ShowConfetti(window._p29ac||"#f59e0b","goal");
    },150);
    showToast("🎯 ¡Meta diaria! "+d.goal+" caps — ¡Increíble!",4000);
    const bar=document.querySelector(".daily-goal-bar");
    if(bar){
      bar.style.transition="box-shadow .3s,background .3s";
      bar.style.boxShadow="0 0 0 2px #f59e0b,0 0 24px #f59e0b88";
      bar.style.background="rgba(245,158,11,.08)";
      setTimeout(()=>{if(bar){bar.style.boxShadow="";bar.style.background="";}},2500);
    }
  }
  return d;
}

// ── P2.9: CONFETTI MEJORADO (soporte de tipos) ──
function p29ShowConfetti(ac, type){
  document.querySelectorAll(".p29-confetti-particle").forEach(e=>e.remove());
  const isGoal=type==="goal";const isComplete=type==="complete"||!type;
  const colors=isGoal
    ?[ac||"#f59e0b","#fbbf24","#fb923c","#f472b6","#fde68a"]
    :[ac||"#63b3ed","#fbbf24","#34d399","#f472b6","#a78bfa","#fb923c"];
  const count=isGoal?60:80;
  const cx=window.innerWidth/2;const cy=window.innerHeight/3;
  for(let i=0;i<count;i++){
    const p=document.createElement("div");
    p.className="p29-confetti-particle";
    const angle=(i/count)*360+(Math.random()-0.5)*40;
    const dist=(isGoal?120:180)+Math.random()*(isGoal?140:200);
    const px=Math.cos(angle*Math.PI/180)*dist+"px";
    const py=Math.sin(angle*Math.PI/180)*dist+"px";
    const sz=isGoal?(4+Math.random()*6):(4+Math.random()*8);
    const isRect=i%4===0;
    const shapeStyle=isRect?`width:${sz}px;height:${sz*2}px;border-radius:2px`:`width:${sz}px;height:${sz}px;border-radius:50%`;
    const rot=(Math.random()*720)+"deg";
    p.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;${shapeStyle};--px:${px};--py:${py};--rot:${rot};background:${colors[i%colors.length]};animation:p29Confetti ${isGoal?.75:.9}s ease-out forwards;animation-delay:${Math.random()*(isGoal?60:80)}ms;z-index:9999;pointer-events:none`;
    document.body.appendChild(p);
  }
  setTimeout(()=>document.querySelectorAll(".p29-confetti-particle").forEach(e=>e.remove()),isGoal?1000:1200);
}
function p29RenderGoalBar(root){

}

// ── P2.8: RACHA DE LECTURA ──
function p28GetStreakKey(){return fbUser?"mat-streak-"+fbUser.uid:"mat-streak-guest";}
function p28GetStreakData(){
  try{const raw=localStorage.getItem(p28GetStreakKey());return raw?JSON.parse(raw):{count:0,lastDate:""};}
  catch(e){return{count:0,lastDate:""};}
}
function p28SaveStreakData(d){try{localStorage.setItem(p28GetStreakKey(),JSON.stringify(d));}catch(e){}}
function p28TouchStreak(){
  const td=today();
  const d=p28GetStreakData();
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yd=yesterday.toISOString().slice(0,10);
  if(d.lastDate===td)return;// ya marcó hoy
  if(d.lastDate===yd){d.count=(d.count||0)+1;}
  else if(d.lastDate!==td){d.count=1;}
  d.lastDate=td;
  p28SaveStreakData(d);
}
function p28GetStreak(){
  const d=p28GetStreakData();
  const td=today();
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yd=yesterday.toISOString().slice(0,10);
  // Si la última fecha no es hoy ni ayer, la racha se rompió — resetear
  if(d.lastDate!==td&&d.lastDate!==yd){
    if(d.count>0){d.count=0;p28SaveStreakData(d);} // limpiar stale data
    return 0;
  }
  return d.count||0;
}

function p28RenderStreakBanner(root){
  const streak=p28GetStreak();

// ── P2.8: RECOMENDACIONES POR SIMILITUD DE TAGS ──
async function p28FetchReco(tags, type, limit=8){
  if(!tags||tags.length===0)return[];
  const jikanType=type==="manga"?"manga":"anime";
  const existingTitles=new Set([...data.manga,...data.anime].map(s=>s.title.toLowerCase()));
  const genreMap={"Shōnen":27,"Seinen":42,"Acción":1,"Comedia":4,"Romance":22,"Horror":14,"Fantasy":10,"Sci-Fi":24,"Sobrenatural":37,"Deportes":30,"Thriller":41,"Mecha":18,"Slice of Life":36,"Isekai":62,"Award Winning":46,"Gore":58,"Drama":8,"Histórico":13,"Escolar":23,"Psicológico":40,"Misterio":7,"Militar":38};
  const results=[];
  const seen=new Set();
  // Usar los top 3 tags que tengan mapping, en orden de popularidad en la colección
  const tagCounts={};
  [...data.manga,...data.anime].forEach(s=>(s.tags||[]).forEach(t=>{tagCounts[t]=(tagCounts[t]||0)+1;}));
  const sortedTags=tags.filter(t=>genreMap[t]).sort((a,b)=>(tagCounts[b]||0)-(tagCounts[a]||0)).slice(0,3);
  if(sortedTags.length===0){
    // Fallback: usar el primero disponible con id por defecto
    sortedTags.push(tags[0]);
  }
  for(const tag of sortedTags){
    if(results.length>=limit)break;
    const genreId=genreMap[tag]||27;
    try{
      const res=await fetch(`https://api.jikan.moe/v4/${jikanType}?genres=${genreId}&order_by=score&sort=desc&limit=12`);
      if(!res.ok)continue;
      const json=await res.json();
      for(const item of (json.data||[])){
        if(results.length>=limit)break;
        const t=(item.title_english||item.title||"").toLowerCase();
        const malId=item.mal_id;
        if(existingTitles.has(t)||seen.has(malId))continue;
        seen.add(malId);
        results.push({
          id:malId,
          title:item.title_english||item.title,
          score:item.score||0,
          tag,
          synopsis:(item.synopsis||"").slice(0,120).replace(/\n/g," ")||"",
          members:item.members||0,
          status:item.status||"",
          year:item.aired?.prop?.from?.year||item.published?.prop?.from?.year||null,
          image:item.images?.jpg?.large_image_url||item.images?.jpg?.image_url||""
        });
      }
      await new Promise(r=>setTimeout(r,350)); // rate limit Jikan
    }catch(e){console.warn("reco fetch:",e);}
  }
  return results;
}

function p28RenderQuickReadFAB(){
  const existing=document.getElementById("p28-qr-fab");
  if(existing)existing.remove();

  const reading=[
    ...data.manga.filter(s=>s.status==="reading").map(s=>({...s,_type:"manga"})),
    ...data.anime.filter(s=>s.status==="reading").map(s=>({...s,_type:"anime"}))
  ].sort((a,b)=>(b.lastUpdated||0)-(a.lastUpdated||0)).slice(0,5);

  if(reading.length===0)return;

  const fab=document.createElement("div");
  fab.id="p28-qr-fab";
  fab.className="quick-read-fab";

  const panel=document.createElement("div");
  panel.className="qr-panel";
  panel.id="p28-qr-panel";

  const pTitle=document.createElement("div");
  pTitle.className="qr-panel-title";
  pTitle.textContent="⚡ Lectura rápida";
  panel.appendChild(pTitle);

  reading.forEach(s=>{
    const isM=s._type==="manga";
    const nc=nextChapter(s);
    const item=document.createElement("div");
    item.className="qr-item";
    const lbl=isM?"cap":"ep";
    item.innerHTML=`<div><div class="qr-item-title">${s.title}</div><div class="qr-item-prog">${lbl}. ${s.completed.length}/${s.total}</div></div>`;
    const btn=document.createElement("button");
    btn.className=`qr-plus-btn ${isM?"":"anime"}`;
    btn.textContent="+";
    btn.disabled=!nc;
    btn.style.opacity=nc?"1":"0.4";
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const type=s._type;
      const x=data[type].find(z=>z.id===s.id);
      if(!x||!nc)return;
      x.completed.push(nc);x.completed.sort((a,b)=>a-b);x.lastUpdated=Date.now();
      if(x.completed.length===x.total){x.status="completed";actLogComplete(x.title,type,x.total);}
      else if(x.status==="plan")x.status="reading";
      actLogChapter(x.title,type,nc,x.completed.length,x.total);
      p28TouchStreak();const _fabStreak=p28GetStreak();p29PlayTick();p29BumpGoal();save();
      p28ShowPlusAnim(type,x.title,_fabStreak);
      item.querySelector(".qr-item-prog").textContent=`${lbl}. ${x.completed.length}/${x.total}`;
      showToast(`${type==="manga"?"Cap.":"Ep."} ${nc} ✓`);
    });
    item.appendChild(btn);
    panel.appendChild(item);
  });

  const toggle=document.createElement("button");
  toggle.className="qr-toggle";
  toggle.title="Lectura rápida";
  toggle.innerHTML="⚡";
  toggle.addEventListener("click",e=>{e.stopPropagation();panel.classList.toggle("open");});
  document.addEventListener("click",e=>{if(!fab.contains(e.target))panel.classList.remove("open");},{passive:true});

  fab.appendChild(panel);
  fab.appendChild(toggle);
  document.body.appendChild(fab);
}

// HISTORIAL DE ACTIVIDAD PERSONAL (v4.0)
// Registra acciones del usuario en localStorage, máximo 200 entradas
const ACT_KEY_PREFIX="mangu-activity-";
function actGetKey(){return ACT_KEY_PREFIX+(fbUser?fbUser.uid:"local");}
function actLog(type,payload){
  try{
    const key=actGetKey();
    let log=[];
    try{log=JSON.parse(localStorage.getItem(key)||"[]");}catch(e){log=[];}
    log.unshift({ts:Date.now(),type,...payload});
    if(log.length>200)log=log.slice(0,200);
    localStorage.setItem(key,JSON.stringify(log));
  }catch(e){}
}
function actGet(limit=60){
  try{
    const key=actGetKey();
    const log=JSON.parse(localStorage.getItem(key)||"[]");
    return log.slice(0,limit);
  }catch(e){return [];}
}
function actClear(){
  try{localStorage.removeItem(actGetKey());}catch(e){}
}

function markChapter(sid,n,cellEl,ac){const x=data[tab].find(z=>z.id===sid);if(!x)return;const wasRead=x.completed.includes(n);

  x.lastUpdated=Date.now();const wasCompleted=x.completed.length===x.total&&x.total>0;if(wasCompleted){x.status="completed";actLogComplete(x.title,tab,x.total);}else if(x.completed.length>0&&x.status==="plan")x.status="reading";

function doAdd(){const t=document.getElementById("add-title")?.value.trim();if(!t)return;const ni=document.getElementById("add-total");const rawVal=ni?.value;const totalVal=Math.max(0,parseInt(rawVal)||0);

function _renderMyHistory(wrap,ac){
  const log=actGet(80);
  // Header con botón limpiar
  const hdr=document.createElement("div");
  hdr.style.cssText="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px";
  const title=document.createElement("div");
  title.style.cssText="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px";
  title.textContent=`${log.length} eventos registrados`;
  const clrBtn=document.createElement("button");
  clrBtn.className="fn-btn sec";
  clrBtn.style.cssText="font-size:10px;padding:4px 10px;color:var(--dng);border-color:rgba(231,76,76,.3)";
  clrBtn.textContent="🗑 Limpiar";
  clrBtn.onclick=()=>{showModal('Limpiar historial','¿Borrar todo el historial de actividad? Esta acción no se puede deshacer.','🗑️',()=>{actClear();tab='history';render();});};
  hdr.append(title,clrBtn);
  wrap.appendChild(hdr);

  if(log.length===0){
    const empty=document.createElement("div");
    empty.style.cssText="text-align:center;padding:40px 20px;color:var(--t3);font-size:12px;background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.08);border-radius:14px";
    empty.innerHTML="📋 Sin actividad registrada aún<br><span style='font-size:10px;opacity:.6'>Los capítulos que marques aparecerán aquí</span>";
    wrap.appendChild(empty);
    return;
  }

  // Agrupar por día
  const grouped={};
  log.forEach(ev=>{
    const d=new Date(ev.ts);
    const today=new Date();const yesterday=new Date(today);yesterday.setDate(today.getDate()-1);
    const dk=d.toDateString();
    const dayLabel=dk===today.toDateString()?"Hoy":dk===yesterday.toDateString()?"Ayer":d.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"short"});
    if(!grouped[dk])grouped[dk]={label:dayLabel,events:[]};
    grouped[dk].events.push(ev);
  });

  Object.values(grouped).forEach(g=>{
    const dayLbl=document.createElement("div");
    dayLbl.className="fn-feed-day-lbl";
    dayLbl.textContent=g.label;
    wrap.appendChild(dayLbl);

    g.events.forEach(ev=>{
      const item=document.createElement("div");
      item.className="hist-item";
      let iconClass="chapter",iconEmoji="📖",titleTxt="",subTxt="";
      const typeLabel=ev.mediaType==="manga"?"Manga":"Anime";
      const bCls=ev.mediaType==="manga"?"m":"a";
      const chLabel=ev.mediaType==="manga"?"Cap.":"Ep.";
      if(ev.type==="chapter"){
        iconClass="chapter";iconEmoji="📖";
        const pct=ev.total>0?Math.round(ev.completed/ev.total*100):0;
        titleTxt=`${ev.title}`;
        subTxt=`<span class="hist-badge ${bCls}">${typeLabel}</span> <span>${chLabel} ${ev.chapter} marcado</span> <span style="color:var(--t3)">${ev.completed}/${ev.total} · ${pct}%</span>`;
      } else if(ev.type==="complete"){
        iconClass="complete";iconEmoji="🎉";
        titleTxt=ev.title;
        subTxt=`<span class="hist-badge ${bCls}">${typeLabel}</span> <span style="color:var(--suc)">Completada</span> <span style="color:var(--t3)">${ev.total} ${chLabel.toLowerCase()}s</span>`;
      } else if(ev.type==="add"){
        iconClass="add";iconEmoji="➕";
        titleTxt=ev.title;
        subTxt=`<span class="hist-badge ${bCls}">${typeLabel}</span> <span>Agregada</span>${ev.total>0?` <span style="color:var(--t3)">${ev.total} ${chLabel.toLowerCase()}s</span>`:""}`;
      } else if(ev.type==="status"){
        iconClass="status";iconEmoji="🔄";
        titleTxt=ev.title;
        subTxt=`<span>Estado: ${ev.status}</span>`;
      }
      const timeStr=_histTimeAgo(ev.ts);
      item.innerHTML=`<div class="hist-icon-wrap ${iconClass}">${iconEmoji}</div><div class="hist-body"><div class="hist-title">${titleTxt}</div><div class="hist-sub">${subTxt}</div></div><div class="hist-time">${timeStr}</div>`;
      wrap.appendChild(item);
    });
  });
}

function _renderFriendsHistoryFeed(wrap,ac){
  if(!fbUser){
    const el=document.createElement("div");
    el.style.cssText="text-align:center;padding:40px 20px;color:var(--t3);font-size:12px;background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.08);border-radius:14px;margin-top:4px";
    el.innerHTML="🔒 Inicia sesión con Google para ver la actividad de tus amigos";
    wrap.appendChild(el);
    return;
  }
  // Mostrar skeleton mientras carga
  const feedContainer=document.createElement("div");
  feedContainer.id="hist-friends-feed";
  const skelHtml=[1,2,3,4].map(()=>`<div class="skel-card"><div class="skel-avatar"></div><div style="flex:1"><div class="skel-line full"></div><div class="skel-line med" style="margin-bottom:0"></div></div></div>`).join("");
  feedContainer.innerHTML=skelHtml;
  wrap.appendChild(feedContainer);

  // Carga asíncrona del feed real
  (async()=>{
    try{
      if(!fbDb)return;
      const fSnap=await withTimeout(fbDb.collection("users").doc(fbUser.uid).collection("friends_accepted").get());
      const friends=fSnap.docs.map(d=>({id:d.id,...d.data()}));
      if(friends.length===0){
        feedContainer.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--t3);font-size:12px;background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.08);border-radius:14px">Sin amigos aún — agrégalos desde el panel Comunidad</div>`;
        return;
      }
      const events=[];
      for(const f of friends){
        try{
          const pd=await withTimeout(fbDb.collection("public_profiles").doc(f.uid).get());
          if(!pd.exists)continue;
          const fp=pd.data();
          const un=fp.username||"usuario";
          const all=[...(fp.allManga||fp.topManga||[]).map(s=>({...s,_type:"manga",_un:un})),
                     ...(fp.allAnime||fp.topAnime||[]).map(s=>({...s,_type:"anime",_un:un}))];
          all.sort((a,b)=>(b.lastUpdated||0)-(a.lastUpdated||0));
          all.slice(0,4).forEach(s=>{
            if(!s.lastUpdated)return;
            const ageMs=Date.now()-s.lastUpdated;
            if(ageMs>14*24*3600*1000)return; // últimos 14 días
            events.push({ts:s.lastUpdated,ageMs,un,uid:f.uid,title:s.title,
              type:s._type,completed:s.completed||0,total:s.total||0,status:s.status,
              avatarUrl:fp.avatarUrl||""});
          });
        }catch(e){}
      }
      events.sort((a,b)=>b.ts-a.ts);
      if(events.length===0){
        feedContainer.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--t3);font-size:12px;background:rgba(255,255,255,.02);border:1px dashed rgba(255,255,255,.08);border-radius:14px">Tus amigos no tienen actividad reciente (últimos 14 días)</div>`;
        return;
      }
      // Construir el feed HTML
      let html="";
      let lastDay="";
      events.slice(0,40).forEach(ev=>{
        const d=new Date(ev.ts);
        const today=new Date();const yesterday=new Date(today);yesterday.setDate(today.getDate()-1);
        const dk=d.toDateString();
        const dayLabel=dk===today.toDateString()?"Hoy":dk===yesterday.toDateString()?"Ayer":d.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"short"});
        if(dk!==lastDay){html+=`<div class="fn-feed-day-lbl">${dayLabel}</div>`;lastDay=dk;}
        let _h=0;for(let i=0;i<ev.un.length;i++)_h=(_h*31+ev.un.charCodeAt(i))&0xFFFFFF;
        const clr=`hsl(${_h%360},60%,42%)`;const clr2=`hsl(${(_h%360+50)%360},55%,35%)`;
        const avHtml=ev.avatarUrl
          ?`<img src="${ev.avatarUrl}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.1)" onerror="this.style.display='none'">`
          :`<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,${clr},${clr2});display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0">${ev.un.charAt(0).toUpperCase()}</div>`;
        const typeAc=ev.type==="manga"?ac:"var(--aa)";
        const chLabel=ev.type==="manga"?"Cap.":"Ep.";
        const pct=ev.total>0?Math.round(ev.completed/ev.total*100):0;
        let actionHtml="";
        if(ev.status==="completed"){
          actionHtml=`Completó <strong style="color:var(--suc)">${ev.title}</strong><span class="hist-meta">✅ ${ev.completed} ${ev.type==="manga"?"caps":"eps"}</span>`;
        } else {
          actionHtml=`<strong style="color:${typeAc}">${ev.title}</strong> — ${chLabel} ${ev.completed}${ev.total>0?`/${ev.total}`:""}<span class="hist-meta">${ev.type==="manga"?"Manga":"Anime"}${ev.total>0?` · ${pct}%`:""}</span>`;
        }
        html+=`<div class="fn-feed-item">
          ${avHtml}
          <div class="fn-feed-body">
            <div class="fn-feed-user">@${ev.un}</div>
            <div class="fn-feed-action" style="font-size:12px">${actionHtml}</div>
          </div>
          <div class="fn-feed-time">${_histTimeAgo(ev.ts)}</div>
        </div>`;
      });
      feedContainer.innerHTML=html;
    }catch(e){
      feedContainer.innerHTML=`<div style="text-align:center;padding:24px;color:var(--t3);font-size:12px">Error al cargar el feed — <button class="fn-btn sec" style="font-size:10px" onclick="window._histSubTab='friends';render()">Reintentar</button></div>`;
    }
  })();
}

function _histTimeAgo(ts){
  const ms=Date.now()-ts;
  const min=Math.floor(ms/60000);
  if(min<1)return "ahora";
  if(min<60)return `${min}m`;
  const h=Math.floor(ms/3600000);
  if(h<24)return `${h}h`;
  const d=Math.floor(ms/86400000);
  if(d<7)return `${d}d`;
  return new Date(ts).toLocaleDateString("es-CL",{day:"numeric",month:"short"});
}

// Helper: intenta localStorage; cae a sessionStorage en modo incógnito o Safari ITP
function _onbGet(k){try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}try{return sessionStorage.getItem(k);}catch(e){}return null;}
function _onbSet(k,v){let saved=false;try{localStorage.setItem(k,v);saved=true;}catch(e){}if(!saved){try{sessionStorage.setItem(k,v);}catch(e){}}}
(function(){
  if(_onbGet("mat-onboarding-done"))return;
  const steps=[
    {icon:"🎌",title:"¡Bienvenido a Mangu!",desc:"Tu tracker personal de manga y anime, 100% gratis y sin anuncios. Lleva el progreso de todo lo que lees o ves en un solo lugar."},
    {icon:"🔍",title:"Portadas automáticas desde MAL",desc:"Escribe cualquier título en el campo de agregar — las portadas, géneros y número de capítulos se rellenan solos desde MyAnimeList. Sin publicidad, sin límites."},
    {icon:"⚡",title:"Dopamina garantizada",desc:"Marca capítulos con +1, acumula rachas diarias 🔥, completa series y desbloquea confetti 🎉. Usa el botón ⚡ para acceso rápido desde cualquier pantalla."},
    {icon:"📊",title:"Tu progreso, tu historia",desc:"El dashboard muestra tiempo invertido, géneros favoritos y más. Sincroniza con Google para acceder desde cualquier dispositivo."}
  ];
  let step=0;
  function showStep(){
    const existing=document.getElementById("onb-overlay");
    if(existing)existing.remove();
    const ov=document.createElement("div");
    ov.className="onb-overlay";
    ov.id="onb-overlay";
    const s=steps[step];
    const dotsHtml=steps.map((_,i)=>`<div class="onb-dot${i===step?" active":i<step?" done":""}"></div>`).join("");
    const ac=theme?.accentManga||"#e74c6f";
    ov.innerHTML=`<div class="onb-box"><div class="onb-steps">${dotsHtml}</div><div class="onb-icon">${s.icon}</div><div class="onb-title">${s.title}</div><div class="onb-desc">${s.desc}</div><div class="onb-btns"><button class="onb-btn-skip" id="onb-skip">Saltar</button><button class="onb-btn-next" id="onb-next" style="background:${ac}">${step===steps.length-1?"🚀 ¡Empezar!":"Siguiente →"}</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector("#onb-skip").onclick=()=>{ov.remove();_onbSet("mat-onboarding-done","1");};
    ov.querySelector("#onb-next").onclick=()=>{
      if(step<steps.length-1){step++;showStep();}
      else{ov.remove();_onbSet("mat-onboarding-done","1");}
    };
  }
  showStep();
})();

// ── PARALLAX EN PORTADAS ──
(function(){
  let _pxTicking=false;
  function _pxUpdate(){
    document.querySelectorAll('.cthm').forEach(img=>{
      const rect=img.getBoundingClientRect();
      const vh=window.innerHeight;
      if(rect.bottom<-50||rect.top>vh+50)return;
      const center=(rect.top+rect.height/2)/vh;
      const offset=(center-0.5)*16;
      img.style.objectPosition='center '+(50+offset)+'%';
    });
    _pxTicking=false;
  }
  document.addEventListener('scroll',function(){if(!_pxTicking){requestAnimationFrame(_pxUpdate);_pxTicking=true;}},{passive:true});
})();
